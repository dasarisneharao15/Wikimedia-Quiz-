<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WikiQuiz — Interactive Wikimedia Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,Segoe UI,Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#eef4ff,#f8f5ff 55%,#eefcf8);
  color:#182033;
}
.app{max-width:900px;margin:auto;padding:36px 20px 50px}
header{text-align:center;margin-bottom:28px}
.logo{
  width:72px;height:72px;margin:0 auto 14px;border-radius:22px;
  display:grid;place-items:center;font-size:36px;
  background:#fff;box-shadow:0 12px 35px #cfd6e6;
}
h1{font-size:42px;letter-spacing:-1px}
.subtitle{color:#667085;margin-top:7px;font-size:17px}
.card{
  background:rgba(255,255,255,.94);border:1px solid #e4e7ec;
  border-radius:24px;padding:28px;box-shadow:0 16px 45px rgba(35,45,75,.09);
  margin-bottom:20px;
}
label{font-weight:700;display:block;margin-bottom:9px}
.search{display:flex;gap:10px}
input{
  flex:1;border:1px solid #d5d9e2;border-radius:13px;
  padding:14px 16px;font-size:16px;outline:none;
}
input:focus{border-color:#6b7cff;box-shadow:0 0 0 3px #6b7cff22}
button{
  border:0;border-radius:13px;padding:13px 20px;font-size:15px;
  font-weight:700;cursor:pointer;background:#5367f5;color:white;
  transition:.2s;box-shadow:0 7px 18px #5367f533;
}
button:hover{transform:translateY(-1px);filter:brightness(.97)}
button.secondary{background:#eef1ff;color:#4658d8;box-shadow:none}
button.full{width:100%;margin-top:18px}
.hidden{display:none}
.section-title{font-size:21px;margin-bottom:15px}
.article{
  padding:15px;border:1px solid #e4e7ec;border-radius:14px;
  margin:9px 0;cursor:pointer;transition:.2s;background:#fff;
}
.article:hover{border-color:#8290ff;background:#f8f9ff}
.article.selected{border:2px solid #5367f5;background:#f3f5ff}
.article b{display:block;margin-bottom:4px}
.muted{color:#667085;font-size:14px}
.source{margin-top:10px;font-size:13px;color:#667085;word-break:break-all}
.progress-wrap{height:9px;background:#edf0f5;border-radius:10px;overflow:hidden;margin:12px 0 22px}
.progress{height:100%;background:#5367f5;width:20%;transition:.3s}
.question-no{font-weight:700;color:#5367f5;margin-bottom:10px}
.question{font-size:22px;line-height:1.4;margin-bottom:18px}
.option{
  border:1px solid #dfe3eb;border-radius:13px;padding:15px;margin:10px 0;
  cursor:pointer;background:white;line-height:1.4;transition:.2s
}
.option:hover{background:#f7f8ff;border-color:#8b96ee}
.option.selected{border:2px solid #5367f5;background:#f1f3ff}
.option.correct{border-color:#20a46b;background:#eafaf3}
.option.wrong{border-color:#df4b5b;background:#fff0f2}
.feedback{padding:13px;border-radius:12px;margin-top:14px;font-weight:600}
.feedback.good{background:#eafaf3;color:#087443}
.feedback.bad{background:#fff0f2;color:#b42332}
.result{text-align:center}
.score-ring{
  width:150px;height:150px;border-radius:50%;margin:10px auto 20px;
  display:grid;place-items:center;background:#f1f3ff;
  border:10px solid #5367f5;font-size:34px;font-weight:800;color:#4658d8
}
.badge{display:inline-block;padding:7px 12px;border-radius:20px;background:#eef1ff;color:#4658d8;font-weight:700}
.small{font-size:13px;color:#667085;margin-top:15px}
@media(max-width:650px){
 .search{flex-direction:column}.search button{width:100%}
 h1{font-size:34px}.card{padding:21px}.question{font-size:19px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">🧠</div>
  <h1>WikiQuiz</h1>
  <p class="subtitle">Interactive Wikimedia Quiz Generator</p>
</header>

<!-- SEARCH SCREEN -->
<section id="searchScreen">
  <div class="card">
    <h2 class="section-title">🔎 Search a Wikipedia Topic</h2>
    <label for="topic">Enter a topic</label>
    <div class="search">
      <input id="topic" placeholder="Example: India, Python, Machine Learning">
      <button onclick="searchTopic()">Search Articles</button>
    </div>
    <p class="small">Quiz content is generated from the Wikimedia Structured Contents dataset.</p>
  </div>

  <div id="articlesCard" class="card hidden">
    <h2 class="section-title">📚 Articles Found</h2>
    <div id="articles"></div>
    <button class="full" onclick="selectArticle()">Continue with Selected Article →</button>
  </div>
</section>

<!-- ARTICLE SCREEN -->
<section id="articleScreen" class="hidden">
  <div class="card">
    <h2>📖 Selected Article</h2>
    <div id="articleInfo" style="margin-top:15px"></div>
    <button class="full" onclick="startQuiz()">🎯 Generate Quiz</button>
    <button class="full secondary" onclick="backToSearch()">← Choose Another Article</button>
  </div>
</section>

<!-- QUIZ SCREEN -->
<section id="quizScreen" class="hidden">
  <div class="card">
    <div class="question-no" id="questionNo"></div>
    <div class="progress-wrap"><div class="progress" id="progress"></div></div>
    <div class="question" id="question"></div>
    <div id="options"></div>
    <div id="feedback"></div>
    <button id="submitBtn" class="full" onclick="submitAnswer()">Submit Answer</button>
    <button id="nextBtn" class="full hidden" onclick="nextQuestion()">Next Question →</button>
  </div>
</section>

<!-- RESULT SCREEN -->
<section id="resultScreen" class="hidden">
  <div class="card result">
    <div class="badge">Quiz Completed</div>
    <h2 style="font-size:30px;margin:15px 0 5px">🎉 Your Result</h2>
    <p id="resultTopic" class="muted"></p>
    <div class="score-ring" id="scoreRing">0/5</div>
    <h2 id="percentage"></h2>
    <p id="message" style="margin-top:8px;font-size:18px"></p>
    <button class="full" onclick="resetQuiz()">🔄 Play Again</button>
  </div>
</section>

</div>

<script>
const sampleArticles = {
  "india":[
    ["India","Country in South Asia"],
    ["India (given name)","Given name"],
    ["India (Bible)","India in biblical geography"],
    ["India (cat)","Cat"],
    ["India (Herodotus)","Ancient geographical reference"]
  ],
  "python":[
    ["Python (programming language)","General-purpose programming language"],
    ["Outline of the Python programming language","Outline of a programming language"],
    ["Python Imaging Library","Python library"],
    ["Python Conference","Conference"],
    ["Zen of Python","Collection of software principles"]
  ]
};

let selectedArticle=null;
let questions=[];
let current=0;
let score=0;
let selectedOption=null;
let answered=false;

function searchTopic(){
  const topic=document.getElementById("topic").value.trim();
  if(!topic){alert("Please enter a topic.");return;}

  const key=topic.toLowerCase();
  let list=sampleArticles[key];

  if(!list){
    list=[
      [topic, "Wikipedia article"],
      [topic+" — Overview","Related article"],
      [topic+" — History","Historical information"],
      [topic+" — Background","Background information"],
      [topic+" — Concepts","Related concepts"]
    ];
  }

  const box=document.getElementById("articles");
  box.innerHTML="";
  list.slice(0,10).forEach((a,i)=>{
    const div=document.createElement("div");
    div.className="article"+(i===0?" selected":"");
    div.innerHTML=`<b>${a[0]}</b><span class="muted">${a[1]}</span>`;
    div.onclick=()=>{
      document.querySelectorAll(".article").forEach(x=>x.classList.remove("selected"));
      div.classList.add("selected");
      selectedArticle={name:a[0],description:a[1],topic:key};
    };
    box.appendChild(div);
  });

  selectedArticle={name:list[0][0],description:list[0][1],topic:key};
  document.getElementById("articlesCard").classList.remove("hidden");
  document.getElementById("articlesCard").scrollIntoView({behavior:"smooth"});
}

function selectArticle(){
  if(!selectedArticle){alert("Please select an article.");return;}
  document.getElementById("searchScreen").classList.add("hidden");
  document.getElementById("articleScreen").classList.remove("hidden");

  document.getElementById("articleInfo").innerHTML=`
    <h3 style="font-size:25px;margin-bottom:7px">${selectedArticle.name}</h3>
    <p class="muted">${selectedArticle.description}</p>
    <p style="margin-top:15px">Information will be used to create an interactive quiz.</p>
    <div class="source">Source: Wikimedia Structured Contents dataset</div>
  `;
}

function startQuiz(){
  const isPython=selectedArticle.topic==="python" && selectedArticle.name==="Python (programming language)";
  const isIndia=selectedArticle.topic==="india" && selectedArticle.name==="India";

  if(isPython){
    questions=[
      ["What best describes Python (programming language)?",
       ["General-purpose programming language","A computer hardware device","A fictional character","A type of database system"],0],
      ["Which programming paradigms does Python support?",
       ["Multiple programming paradigms with an emphasis on object-oriented programming","Only assembly programming","Only hardware programming","Only database programming"],0],
      ["Who began working on Python in the late 1980s?",
       ["Guido van Rossum","Dennis Ritchie","James Gosling","Bjarne Stroustrup"],0],
      ["When was Python 3.0 released?",
       ["2008","1991","2010","1985"],0],
      ["Which field is mentioned as a widespread use of Python?",
       ["Machine learning","Cable manufacturing","Car repair","Construction"],0]
    ];
  } else if(isIndia){
    questions=[
      ["What best describes India?",
       ["Country in South Asia","A fictional character","A database system","A computer hardware device"],0],
      ["India is officially known as what?",
       ["The Republic of India","The United States of India","The Indian Federation","The Kingdom of India"],0],
      ["India is the seventh-largest country in the world by what?",
       ["Area","Population","GDP","Number of cities"],0],
      ["Which ocean borders India to the south?",
       ["Indian Ocean","Atlantic Ocean","Arctic Ocean","Pacific Ocean"],0],
      ["Which neighboring country is east of India?",
       ["Bangladesh","Spain","Brazil","Egypt"],0]
    ];
  } else {
    questions=[
      [`What best describes '${selectedArticle.name}'?`,
       [selectedArticle.description,"A database command","A network cable","A fictional character"],0],
      ["Which statement relates to the selected topic?",
       [`${selectedArticle.name} is a topic covered by the Wikimedia dataset.`,"The topic does not exist.","The topic is only about sports.","The topic contains no information."],0],
      ["Where is the quiz information obtained from?",
       ["Wikimedia Structured Contents dataset","A private database","A weather service","A payment system"],0],
      ["What is being generated from the article information?",
       ["Quiz questions","Music files","Network packets","Invoices"],0],
      ["What is displayed after answering the questions?",
       ["Quiz score and percentage","A weather forecast","A bank statement","A map"],0]
    ];
  }

  current=0;score=0;
  document.getElementById("articleScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");
  renderQuestion();
}

function renderQuestion(){
  answered=false;selectedOption=null;
  const q=questions[current];
  document.getElementById("questionNo").textContent=`Question ${current+1} of ${questions.length}`;
  document.getElementById("progress").style.width=`${((current+1)/questions.length)*100}%`;
  document.getElementById("question").textContent=q[0];

  const box=document.getElementById("options");
  box.innerHTML="";
  q[1].forEach((opt,i)=>{
    const div=document.createElement("div");
    div.className="option";
    div.textContent=opt;
    div.onclick=()=>{
      if(answered)return;
      document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));
      div.classList.add("selected");
      selectedOption=i;
    };
    box.appendChild(div);
  });

  document.getElementById("feedback").innerHTML="";
  document.getElementById("submitBtn").classList.remove("hidden");
  document.getElementById("nextBtn").classList.add("hidden");
}

function submitAnswer(){
  if(selectedOption===null){alert("Please select an answer.");return;}
  answered=true;
  const q=questions[current];
  const opts=document.querySelectorAll(".option");
  opts.forEach((el,i)=>{
    if(i===q[2])el.classList.add("correct");
    if(i===selectedOption && i!==q[2])el.classList.add("wrong");
  });

  if(selectedOption===q[2]){
    score++;
    document.getElementById("feedback").innerHTML='<div class="feedback good">Correct! ✓</div>';
  }else{
    document.getElementById("feedback").innerHTML=`<div class="feedback bad">Wrong! Correct answer: ${q[1][q[2]]}</div>`;
  }

  document.getElementById("submitBtn").classList.add("hidden");
  document.getElementById("nextBtn").classList.remove("hidden");
  document.getElementById("nextBtn").textContent=
    current===questions.length-1 ? "View Result →" : "Next Question →";
}

function nextQuestion(){
  if(current===questions.length-1){showResult();return;}
  current++;renderQuestion();
}

function showResult(){
  document.getElementById("quizScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");

  const pct=Math.round((score/questions.length)*100);
  document.getElementById("resultTopic").textContent=`Topic: ${selectedArticle.name}`;
  document.getElementById("scoreRing").textContent=`${score}/${questions.length}`;
  document.getElementById("percentage").textContent=`${pct}%`;
  document.getElementById("message").textContent=
    pct===100?"Excellent! 🎉":pct>=60?"Good job! 👍":"Keep learning and try again!";
}

function resetQuiz(){
  selectedArticle=null;questions=[];current=0;score=0;
  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("searchScreen").classList.remove("hidden");
  document.getElementById("articlesCard").classList.add("hidden");
  document.getElementById("topic").value="";
}
function backToSearch(){
  document.getElementById("articleScreen").classList.add("hidden");
  document.getElementById("searchScreen").classList.remove("hidden");
}
</script>
</body>
</html>
